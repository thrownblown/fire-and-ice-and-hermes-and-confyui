<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fire &amp; Ice — Shot/Chunk Browser</title>
<style>
:root {
  --bg:#0d0f14; --panel:#151923; --panel2:#1b2130; --line:#262d3f;
  --txt:#d8dee9; --dim:#8a93a8; --dim2:#5b6478;
  --accent:#e6b84d; --accent2:#9cc; --link:#6db4ff;
}
* { box-sizing: border-box; }
html,body { height:100%; }
body {
  margin:0; background:var(--bg); color:var(--txt);
  font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
}
header {
  flex:0 0 auto; padding:10px 16px; background:var(--panel);
  border-bottom:1px solid var(--line); display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
header h1 { font-size:16px; margin:0; font-weight:600; letter-spacing:.2px; }
header h1 .sub { color:var(--dim); font-weight:400; font-size:12px; }
.tabs { display:flex; gap:6px; margin-left:6px; }
.tab {
  padding:6px 16px; border:1px solid var(--line); background:var(--panel2);
  color:var(--dim); cursor:pointer; border-radius:6px; font-size:13px; user-select:none;
}
.tab.active { background:var(--accent); color:#1a1504; border-color:var(--accent); }
.search { margin-left:auto; display:flex; gap:8px; align-items:center; }
.search input {
  background:var(--panel2); border:1px solid var(--line); color:var(--txt);
  padding:6px 10px; border-radius:6px; font-size:13px; width:240px; outline:none;
}
.search input:focus { border-color:var(--accent); }
.chip { padding:3px 10px; border:1px solid var(--line); border-radius:20px; font-size:12px; color:var(--dim); cursor:pointer; user-select:none; }
.chip.active { background:var(--accent2); color:#071318; border-color:var(--accent2); }
main { flex:1 1 auto; display:flex; min-height:0; }
#list { flex:0 0 360px; overflow-y:auto; border-right:1px solid var(--line); background:var(--panel); }
#detail { flex:1 1 auto; overflow-y:auto; padding:18px 22px 40px; }
li.item { list-style:none; padding:9px 14px; border-bottom:1px solid var(--line); cursor:pointer; display:flex; flex-direction:column; gap:3px; }
li.item:hover { background:var(--panel2); }
li.item.selected { background:#232a3b; box-shadow:inset 3px 0 0 var(--accent); }
li.item .t { font-weight:600; font-size:13px; }
li.item .t .id { color:var(--accent); font-family:ui-monospace,Consolas,monospace; }
li.item .m { font-size:11.5px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
li.item .m b { color:var(--dim2); font-weight:500; }
.grp { padding:8px 14px 4px; font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--dim2); background:var(--bg); position:sticky; top:0; z-index:1; }
.empty { padding:20px; color:var(--dim); font-size:13px; }
#detail .crumb { font-size:12px; color:var(--dim); margin-bottom:4px; }
#detail h2 { margin:0 0 2px; font-size:20px; }
#detail h2 .mono { font-family:ui-monospace,Consolas,monospace; color:var(--accent); }
#detail .metaline { color:var(--dim); font-size:12.5px; margin-bottom:14px; }
#detail .metaline span { color:var(--dim2); }
.media { display:flex; gap:14px; align-items:flex-start; flex-wrap:wrap; margin-bottom:16px; }
.videobox { flex:1 1 460px; max-width:640px; }
.videobox video { width:100%; background:#000; border:1px solid var(--line); border-radius:6px; max-height:420px; }
.stills { flex:1 1 320px; max-width:420px; }
.cap { font-size:11px; color:var(--dim); margin:6px 0 12px; }
.thumbrow { display:flex; gap:8px; }
.thumbrow img { width:32%; border:1px solid var(--line); border-radius:4px; cursor:pointer; transition:transform .1s; }
.thumbrow img:hover { transform:scale(1.04); border-color:var(--accent); }
.section { margin-bottom:20px; }
.section h3 {
  font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--dim2);
  margin:0 0 8px; padding-bottom:4px; border-bottom:1px solid var(--line);
}
.dl { display:flex; gap:10px; padding:4px 0; border-bottom:1px dashed var(--line); }
.dl .sp { flex:0 0 110px; color:var(--accent2); font-weight:600; font-size:12.5px; }
.dl .tx { color:var(--txt); }
pre.prompt {
  background:var(--panel2); border:1px solid var(--line); border-radius:6px;
  padding:12px 14px; white-space:pre-wrap; color:#c8d0dd; font:12px/1.5 ui-monospace,Consolas,monospace;
  max-height:420px; overflow-y:auto; margin:0;
}
.pills { display:flex; gap:6px; flex-wrap:wrap; }
.pill { padding:2px 9px; background:var(--panel2); border:1px solid var(--line); border-radius:4px; font-size:11.5px; }
.nav { display:flex; gap:8px; align-items:center; margin-bottom:14px; }
.nav button, button.btn {
  background:var(--panel2); border:1px solid var(--line); color:var(--txt);
  padding:5px 12px; border-radius:6px; cursor:pointer; font-size:12.5px;
}
.nav button:hover:not([disabled]), button.btn:hover { border-color:var(--accent); }
.nav .pos { color:var(--dim); font-size:12px; }
a { color:var(--link); text-decoration:none; }
a:hover { text-decoration:underline; }
.refgrid { display:flex; gap:10px; flex-wrap:wrap; }
.refgrid .ref { position:relative; width:130px; }
.refgrid .ref img { width:130px; height:98px; object-fit:cover; border:1px solid var(--line); border-radius:6px; display:block; background:#000; }
.refgrid .ref .nm { font-size:10.5px; color:var(--dim); margin-top:3px; word-break:break-all; }
.refgrid .ref .del { position:absolute; top:4px; left:4px; font-size:11px; padding:1px 7px; border-radius:4px; background:#0009; color:#f88; border:1px solid #f88; cursor:pointer; display:none; }
.refgrid .ref:hover .del { display:block; }
.scenestills { display:flex; gap:14px; flex-direction:column; }
.scenestill-grp .gh { font-size:12px; color:var(--dim); margin-bottom:6px; }
.scenestill-grp .gh a { font-family:ui-monospace,Consolas,monospace; }
.pickrow { display:flex; gap:8px; flex-wrap:wrap; }
.pick { position:relative; width:110px; cursor:pointer; }
.pick img { width:110px; height:72px; object-fit:contain; background:#000; border:1px solid var(--line); border-radius:4px; display:block; }
.pick:hover img { border-color:var(--accent); }
.pick .nm { font-size:10px; color:var(--dim); margin-top:2px; word-break:break-all; }
.pick.added img { border-color:var(--accent2); }
.pick .badge { position:absolute; top:4px; right:4px; font-size:10px; padding:1px 5px; border-radius:3px; background:#000c; color:var(--accent2); display:none; }
.pick.added .badge { display:block; }
.seqstrip { display:flex; flex-wrap:wrap; gap:3px; }
.seqtag { padding:2px 6px; background:var(--panel2); border:1px solid var(--line); border-radius:3px; font-size:10.5px; font-family:ui-monospace,Consolas,monospace; color:var(--dim); cursor:pointer; user-select:none; }
.seqtag:hover { border-color:var(--accent); color:var(--txt); }
.seqtag.sel { background:var(--accent2); color:#071318; border-color:var(--accent2); }
.setupcard { border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:12px; background:var(--panel); }
.setupcard .shead { font-size:12.5px; margin-bottom:8px; }
.setupcard .shead a:first-child { font-family:ui-monospace,Consolas,monospace; color:var(--accent); font-weight:600; }
.addref { width:130px; height:98px; border:1px dashed var(--line); border-radius:6px; display:flex; align-items:center; justify-content:center; color:var(--dim); cursor:pointer; font-size:24px; user-select:none; }
.addref:hover { border-color:var(--accent); color:var(--accent); }
.banner { padding:8px 14px; background:#221d10; border:1px solid var(--line); border-radius:6px; font-size:12px; color:var(--dim); margin-bottom:14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.banner .btn { padding:3px 10px; font-size:11.5px; }
textarea.trait { width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--txt); border-radius:6px; padding:8px 10px; font:13px/1.5 system-ui,sans-serif; resize:vertical; min-height:54px; }
.slot { display:flex; gap:10px; align-items:center; padding:6px 0; border-bottom:1px dashed var(--line); flex-wrap:wrap; }
.slot .lbl { flex:0 0 84px; color:var(--accent2); font-weight:600; font-size:12.5px; font-family:ui-monospace,Consolas,monospace; }
.slot select { background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:4px; padding:3px 6px; font-size:12.5px; max-width:280px; }
.slot video { height:120px; width:auto; background:#000; border:1px solid var(--line); border-radius:4px; }
.slot img.pick { height:56px; border:1px solid var(--line); border-radius:4px; }
input[type=text].inline { background:var(--panel2); border:1px solid var(--line); color:var(--txt); padding:4px 8px; border-radius:4px; font-size:12.5px; width:100%; }
code { background:var(--panel2); border:1px solid var(--line); border-radius:3px; padding:0 4px; font-size:11.5px; }
</style>
</head>
<body>
<header>
  <h1>Fire &amp; Ice <span class="sub">shot / chunk browser</span></h1>
  <div class="tabs">
    <div class="tab" id="tabShots">Shots <span id="nShots"></span></div>
    <div class="tab" id="tabChunks">Chunks <span id="nChunks"></span></div>
    <div class="tab" id="tabSetups">Setups <span id="nSetups"></span></div>
    <div class="tab" id="tabChars">Characters <span id="nChars"></span></div>
    <div class="tab" id="tabBgs">Backgrounds <span id="nBgs"></span></div>
    <div class="tab" id="tabTests">Test runs <span id="nTests"></span></div>
  </div>
  <div class="search">
    <span class="chip" id="fNekron">Nekron</span>
    <span class="chip" id="fTeegra">Teegra</span>
    <span class="chip" id="fLarn">Larn</span>
    <input id="q" type="text" placeholder="search…" autocomplete="off">
  </div>
</header>
<main>
  <div id="list"></div>
  <div id="detail"><div class="empty">Loading…</div></div>
</main>

<script src="shot-browser-data.js"></script>
<script src="refs/refs-data.js"></script>
<script src="setups-data.js"></script>
<script src="runs/testruns-data.js"></script>
<script>
(function(){
  'use strict';
  /* ================================================================
     URL IS THE STATE. Every navigation writes location first
     (pushState / replaceState), then render() reads location.search
     and draws. Nothing renders from in-memory selection state, so
     every view is a shareable deep link and back/forward just works.

     Canonical params:
       view   = shots | chunks | chars | bgs   (default: shots)
       shot   = 00196        (aliases on load: shotid, s)
       chunk  = S05-c04      (aliases: chunkid, c)
       char   = TEEGRA       (alias: charid)
       bg     = ice-cave     (alias: bgid)
       f      = NEKRON|TEEGRA|LARN   quick cast filter (shots/chunks)
       q      = search text
     ================================================================ */
  var D = window.SHOTDATA;
  var R = window.REFSDATA || {characters:[], backgrounds:[]};
  var T = window.TESTDATA || {runs:[]};
  var SU = window.SETUPDATA || {scenes:[], shot_setup:{}};
  var shots = D.shots, chunks = D.chunks, caps = D.captions;
  var names = {NEKRON:'Nekron', TEEGRA:'Teegra', LARN:'Larn'};

  var $list = document.getElementById('list');
  var $detail = document.getElementById('detail');
  document.getElementById('nShots').textContent = shots.length;
  document.getElementById('nChunks').textContent = chunks.length;
  document.getElementById('nSetups').textContent = SU.scenes.length;
  document.getElementById('nChars').textContent = R.characters.length;
  document.getElementById('nBgs').textContent = R.backgrounds.length;
  document.getElementById('nTests').textContent = T.runs.length;

  /* ---------------------------------------------------------- url state */
  function params(){ return new URLSearchParams(location.search); }

  function nav(patch, replace){
    var p = params();
    Object.keys(patch).forEach(function(k){
      if (patch[k] === null || patch[k] === undefined || patch[k] === '') p.delete(k);
      else p.set(k, String(patch[k]));
    });
    var qs = p.toString();
    var url = location.pathname + (qs ? '?' + qs : '');
    if (replace) history.replaceState(null, '', url);
    else history.pushState(null, '', url);
    render();
  }

  function pad5(x){ if (x==null || x==='') return null; x = String(x); if (/^\d+$/.test(x)) while (x.length < 5) x = '0' + x; return x; }

  function state(){
    var p = params();
    var view = p.get('view') || 'shots';
    return {
      view: view,
      q: p.get('q') || '',
      charFilter: (view==='shots'||view==='chunks') ? (p.get('f')||null) : null,
      selShot: pad5(p.get('shot') || p.get('shotid') || p.get('s')),
      selChunk: p.get('chunk') || p.get('chunkid') || p.get('c'),
      selChar: (p.get('char') || p.get('charid') || '').toUpperCase() || null,
      selBg: p.get('bg') || p.get('bgid') || null,
      selScene: (view==='setups') ? (p.get('scene') || null) : null,
      selSetup: (view==='setups') ? (p.get('setup') || null) : null,
      selRun: (p.get('run') || '').toUpperCase() || null
    };
  }

  /* ---------------------------------------------------------- lookups */
  function esc(x){ return (x==null?'':String(x)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function chunkById(id){ for (var i=0;i<chunks.length;i++) if(chunks[i].id===id) return chunks[i]; return null; }
  function shotByNum(n){ for (var i=0;i<shots.length;i++) if(shots[i].num===n) return shots[i]; return null; }
  function charByName(n){ n=(n||'').toUpperCase(); for (var i=0;i<R.characters.length;i++) if(R.characters[i].name===n) return R.characters[i]; return null; }
  function bgBySlug(s){ for (var i=0;i<R.backgrounds.length;i++) if(R.backgrounds[i].slug===s) return R.backgrounds[i]; return null; }
  function sceneOf(s){ var cm = s.chunk ? chunkById(s.chunk) : null; return cm && cm.scene ? cm.scene : '?'; }
  function stampedNamesOfShot(s){ var cm = s.chunk ? chunkById(s.chunk) : null; return cm && cm.names ? cm.names : []; }

  /* -------------------------------------------------- editable overlay
     Trait edits, background setting lists, browser-uploaded refs and
     chunk prompt-input bindings live in localStorage so the page stays
     serverless. tools/import_refs.py folds an exported bundle into
     refs/roster.json + refs/ image files, making edits on-disk truth. */
  function LS(){ try { return window.localStorage; } catch(e){ return null; } }
  function lsGet(k, dflt){ var ls=LS(); if(!ls) return dflt; try { var v=ls.getItem(k); return v==null?dflt:JSON.parse(v); } catch(e){ return dflt; } }
  function lsSet(k, v){ var ls=LS(); if(ls){ try { ls.setItem(k, JSON.stringify(v)); } catch(e){} } }

  var localRefs    = lsGet('fni.refs.v1', []);        // [{kind:'char'|'bg', key, name, dataUrl}]
  var traitEdits   = lsGet('fni.traits.v1', {});      // NAME -> text
  var settingEdits = lsGet('fni.bgsettings.v1', {});  // slug -> [settings]
  var promptInputs = lsGet('fni.inputs.v1', {});      // chunkId -> {char:{NAME:refname}, videos:[shotnums], bg:slug}
  function saveRefs(){ lsSet('fni.refs.v1', localRefs); }
  function saveTraits(){ lsSet('fni.traits.v1', traitEdits); }
  function saveBgSettings(){ lsSet('fni.bgsettings.v1', settingEdits); }
  function saveInputs(){ lsSet('fni.inputs.v1', promptInputs); }

  function refsFor(kind, key){
    var disk = (kind==='char' ? (charByName(key)||{}).refs : (bgBySlug(key)||{}).refs) || [];
    var sub = kind==='char' ? 'refs/characters/' : 'refs/backgrounds/';
    var out = disk.map(function(fn){ return {name: fn, url: sub + encodeURIComponent(key) + '/' + encodeURIComponent(fn), disk:true}; });
    for (var i=0;i<localRefs.length;i++){
      var r = localRefs[i];
      if (r.kind===kind && r.key===key) out.push({name:r.name, url:r.dataUrl, disk:false});
    }
    return out;
  }
  function traitsOf(c){ return traitEdits[c.name] !== undefined ? traitEdits[c.name] : (c.traits||''); }
  function settingsOf(b){ return settingEdits[b.slug] !== undefined ? settingEdits[b.slug] : (b.settings||[]); }
  function bgForSetting(setting){
    if (!setting) return null;
    var s = setting.toLowerCase();
    for (var i=0;i<R.backgrounds.length;i++){
      var list = settingsOf(R.backgrounds[i]);
      for (var j=0;j<list.length;j++) if (list[j].toLowerCase()===s) return R.backgrounds[i];
    }
    return null;
  }
  function charsOfChunk(c){
    var out = {};
    (c.names||[]).forEach(function(n){ if (charByName(n)) out[n.toUpperCase()] = 1; });
    (c.cast||'').split(/[,\/]/).forEach(function(t){
      t = t.replace(/\(.*?\)/g,'').trim().toUpperCase();
      if (t && charByName(t)) out[t] = 1;
    });
    return Object.keys(out);
  }

  /* ------------------------------------------------------------ setups
     A setup = one camera angle shared by 1+ shots of a scene (SSIM
     clustering, core/continuity.py). Cross-cut scenes alternate between
     setups; shots in one setup are prompted together (shared master
     background plate) then split apart again at assembly.
     Manual overlay: shot→setup reassignments + setup→background-plate
     binding + notes, in localStorage; exportable via the bundle. */
  var setupMoves = lsGet('fni.setupmoves.v1', {});   // shotnum -> tag
  var setupPlates = lsGet('fni.setupplates.v1', {}); // tag -> bg slug
  var setupNotes = lsGet('fni.setupnotes.v1', {});   // tag -> text
  function saveSetupMoves(){ lsSet('fni.setupmoves.v1', setupMoves); }
  function saveSetupPlates(){ lsSet('fni.setupplates.v1', setupPlates); }
  function saveSetupNotes(){ lsSet('fni.setupnotes.v1', setupNotes); }

  function sceneById(id){ for (var i=0;i<SU.scenes.length;i++) if (SU.scenes[i].scene===id) return SU.scenes[i]; return null; }
  function setupSceneOf(tag){ return tag ? sceneById(tag.split('-')[0]) : null; }
  function setupTagOfShot(n){ return setupMoves[n] || SU.shot_setup[n] || null; }
  // every shot number belonging to a scene (disk clustering ∪ manual moves)
  function sceneShots(sc){
    var out = {};
    Object.keys(sc.setups).forEach(function(t){ sc.setups[t].forEach(function(n){ out[n] = 1; }); });
    Object.keys(setupMoves).forEach(function(n){
      var sh = shotByNum(n);
      if (sh && sceneOf(sh) === sc.scene) out[n] = 1;
    });
    return Object.keys(out).sort();
  }
  // effective membership: disk clustering with manual moves applied
  function setupMembers(sc, tag){
    return sceneShots(sc).filter(function(n){ return setupTagOfShot(n) === tag; });
  }
  function allSetupTags(sc){
    var tags = {};
    sceneShots(sc).forEach(function(n){ var t = setupTagOfShot(n); if (t) tags[t] = 1; });
    return Object.keys(tags).sort();
  }

  /* ---------------------------------------------------------- matching */
  function matchesShot(s, st){
    if (st.charFilter && stampedNamesOfShot(s).join(' ').indexOf(st.charFilter) < 0) return false;
    if (st.q){
      var hay = (s.num + ' ' + s.id + ' ' + (s.chunk||'') + ' ' + sceneOf(s) + ' '
        + (s.detail.setting||'') + ' ' + (s.detail.motion||'')).toLowerCase();
      if (hay.indexOf(st.q.toLowerCase()) < 0) return false;
    }
    return true;
  }
  function matchesChunk(c, st){
    if (st.charFilter && (c.names||[]).join(' ').indexOf(st.charFilter) < 0) return false;
    if (st.q){
      var hay = (c.id + ' ' + (c.scene||'') + ' ' + (c.cast||'') + ' ' + (c.location||'')).toLowerCase();
      if (hay.indexOf(st.q.toLowerCase()) < 0) return false;
    }
    return true;
  }
  function matchesChar(c, st){
    if (!st.q) return true;
    var hay = (c.name + ' ' + (c.display||'') + ' ' + (c.aliases||[]).join(' ') + ' ' + traitsOf(c)).toLowerCase();
    return hay.indexOf(st.q.toLowerCase()) >= 0;
  }
  function matchesBg(b, st){
    if (!st.q) return true;
    var hay = ((b.name||'') + ' ' + b.slug + ' ' + settingsOf(b).join(' ')).toLowerCase();
    return hay.indexOf(st.q.toLowerCase()) >= 0;
  }

  /* -------------------------------------------------------------- list */
  function renderList(st){
    $list.innerHTML = '';
    function item(sel, html, onclick){
      var li = document.createElement('li');
      li.className = 'item' + (sel?' selected':'');
      li.innerHTML = html;
      li.onclick = onclick;
      $list.appendChild(li);
    }
    if (st.view === 'shots'){
      var cur = null;
      shots.forEach(function(s){
        if (!matchesShot(s, st)) return;
        var sc = sceneOf(s);
        if (sc !== cur){ cur = sc; var g = document.createElement('div'); g.className='grp'; g.textContent = sc; $list.appendChild(g); }
        item(st.selShot===s.num,
          '<div class="t"><span class="id">#'+s.num+'</span> '+esc(s.start)+'</div>'
          + '<div class="m">'+s.dur+'s · '+esc(s.detail.setting||s.chunk||'')+' <b>'+stampedNamesOfShot(s).map(function(n){return names[n]||n;}).join(' ')+'</b></div>',
          function(){ nav({shot:s.num}); });
      });
      if (!$list.children.length) $list.innerHTML = '<div class="empty">no shots match</div>';
    } else if (st.view === 'chunks'){
      chunks.forEach(function(c){
        if (!matchesChunk(c, st)) return;
        item(st.selChunk===c.id,
          '<div class="t"><span class="id">'+esc(c.id)+'</span> '+esc(c.scene||'')+'</div>'
          + '<div class="m">'+(c.shot_nums||[]).length+' shots · '+esc(c.cast||'')+' <b>'+(c.names||[]).map(function(n){return names[n]||n;}).join(' ')+'</b></div>',
          function(){ nav({chunk:c.id}); });
      });
      if (!$list.children.length) $list.innerHTML = '<div class="empty">no chunks match</div>';
    } else if (st.view === 'setups'){
      SU.scenes.forEach(function(sc){
        if (st.q){
          var hay = (sc.scene + ' ' + allSetupTags(sc).join(' ')).toLowerCase();
          if (hay.indexOf(st.q.toLowerCase()) < 0) return;
        }
        var multi = allSetupTags(sc).filter(function(t){ return setupMembers(sc, t).length > 1; }).length;
        item(st.selScene===sc.scene,
          '<div class="t"><span class="id">'+esc(sc.scene)+'</span>'+(sc.crosscut?' <span style="color:var(--accent2);font-size:11px">CROSS-CUT</span>':'')+'</div>'
          + '<div class="m">'+sc.shots+' shots · '+Object.keys(sc.setups).length+' setups · <b>'+multi+' multi-shot</b>'+(sc.alternations?' · '+sc.alternations+' alts':'')+'</div>',
          function(){ nav({scene:sc.scene, setup:null}); });
      });
      if (!$list.children.length) $list.innerHTML = '<div class="empty">no scenes match — run core/continuity.py + tools/build_setups_data.py</div>';
    } else if (st.view === 'chars'){
      R.characters.forEach(function(c){
        if (!matchesChar(c, st)) return;
        item(st.selChar===c.name,
          '<div class="t"><span class="id">'+esc(c.display||c.name)+'</span></div>'
          + '<div class="m">'+refsFor('char', c.name).length+' refs · <b>'+esc((traitsOf(c)||'no traits').slice(0,54))+'</b></div>',
          function(){ nav({char:c.name}); });
      });
      if (!$list.children.length) $list.innerHTML = '<div class="empty">no characters match</div>';
    } else if (st.view === 'bgs'){
      R.backgrounds.forEach(function(b){
        if (!matchesBg(b, st)) return;
        item(st.selBg===b.slug,
          '<div class="t"><span class="id">'+esc(b.slug)+'</span></div>'
          + '<div class="m">'+esc(b.name)+' · '+refsFor('bg', b.slug).length+' refs · '+settingsOf(b).length+' settings</div>',
          function(){ nav({bg:b.slug}); });
      });
      if (!$list.children.length) $list.innerHTML = '<div class="empty">no backgrounds match</div>';
    } else if (st.view === 'tests'){
      if (!T.runs.length) $list.innerHTML = '<div class="empty">no test runs recorded — run tools/build_testruns_data.py</div>';
      T.runs.forEach(function(r){
        if (st.q){
          var hay = (r.id+' '+(r.scope||'')+' '+(r.title||'')+' '+(r.question||'')+' '+(r.notes||'')).toLowerCase();
          if (hay.indexOf(st.q.toLowerCase()) < 0) return;
        }
        item(st.selRun===r.id,
          '<div class="t"><span class="id">'+esc(r.id)+'</span> '+(r.scope?esc(r.scope)+' · ':'')+esc(r.title||'')+'</div>'
          + '<div class="m">'+r.files.length+' clips · <b>'+esc(r.verdict||'')+'</b></div>',
          function(){ nav({run:r.id}); });
      });
      if (!$list.children.length) $list.innerHTML = '<div class="empty">no test runs match</div>';
    }
  }

  /* ------------------------------------------------------------ detail */

    h += '<h2><span class="mono">#'+s.num+'</span> '+esc(s.detail.setting||'')+'</h2>';
    h += '<div class="metaline">'+esc(s.start)+' → '+esc(s.end)+' <span>·</span> '+s.dur+'s <span>·</span> '
      + [s.detail.size,s.detail.angle,s.detail.motion].filter(Boolean).map(esc).join(' <span>·</span> ') + '</div>';
    h += '<div class="nav">'
      + (prev ? '<button data-nav="shot:'+esc(prev.num)+'">← prev</button>' : '<button disabled>← prev</button>')
      + (next ? '<button data-nav="shot:'+esc(next.num)+'">next →</button>' : '<button disabled>next →</button>')
      + '<span class="pos">shot '+(idx+1)+' / '+shots.length+'</span></div>';

      + '<div class="stills"><div class="thumbrow">';
    (s.stills||[]).forEach(function(fn){
      h += '<img src="stills/full/'+fn+'" loading="lazy" title="'+esc(caps[fn]||fn)+'" alt="'+fn+'">';
    });
    h += '</div></div></div>';

    var chk = s.chunk ? chunkById(s.chunk) : null;
    var cs = chk ? charsOfChunk(chk) : [];
    var stag = setupTagOfShot(s.num);
    if (stag){
      h += '<div class="section"><h3>Setup</h3>'
        + '<a href="#" data-nav="setup:'+esc(stag)+'">'+esc(stag)+'</a>'
        + ' <span style="color:var(--dim);font-size:12px">— camera angle group · shots of this setup are prompted together</span></div>';
    }
    if (cs.length){
      h += '<div class="section"><h3>Characters (via '+esc(s.chunk)+')</h3><div class="pills">';
      cs.forEach(function(n){ var c = charByName(n); h += '<span class="pill"><a href="#" data-nav="char:'+esc(n)+'">'+esc(c?(c.display||c.name):n)+'</a></span>'; });

    else h += '<span style="color:var(--dim);font-size:12.5px">no background matches setting “'+esc(s.detail.setting||'?')+'” — <a href="#" data-nav="view:bgs">see Backgrounds</a></span>';
    h += '</div>';

    h += '<div class="section"><h3>Captions</h3>';
    var shown = false;
    (s.stills||[]).forEach(function(fn){ var c = caps[fn]; if (c){ shown = true; h += '<div class="cap"><b>'+fn+'</b> — '+esc(c)+'</div>'; } });
    if (!shown) h += '<div class="cap">(no captions for these stills)</div>';

    var dl = s.dialog || [];
    if (dl.length){
      h += '<div class="section"><h3>Dialogue</h3>';
      dl.forEach(function(d){ h += '<div class="dl"><span class="sp">'+esc(d.speaker)+'</span><span class="tx">'+esc(d.text)+'</span></div>'; });
      h += '</div>';

    var intP = chk ? chk.prompt : '';
    if (intP) h += '<div class="section"><h3>Integrated prompt ('+esc(s.chunk)+')</h3><pre class="prompt">'+esc(intP)+'</pre></div>';
    if (s.six_prompt) h += '<div class="section"><h3>Six-section prompt</h3><pre class="prompt">'+esc(s.six_prompt)+'</pre></div>';

  function detailChunk(c){

  /* Chunk prompt inputs: bind character refs to <Picture N> slots and
     shot clips to <Video N> slots — the prompt builder reads these to
     assemble subject_definitions later. */
  function renderPromptInputs(c){
    var inp = promptInputs[c.id] || {};
    inp.char = inp.char || {};
    var cs = charsOfChunk(c);
    var h = '<div class="section"><h3>Prompt inputs</h3>';
    h += '<div style="color:var(--dim);font-size:12px;margin-bottom:8px">Which refs become <code>&lt;Picture N&gt;</code> / <code>&lt;Video N&gt;</code> labels when this chunk\'s prompt is built. Upload refs on each character\'s page first.</div>';
    var pn = 0;
    cs.forEach(function(n){
      var ch = charByName(n); if (!ch) return;
      pn++;
      var chosen = inp.char[n] || '';
      var refs = refsFor('char', n);
      h += '<div class="slot"><span class="lbl">Picture '+pn+'</span>'
        + '<a href="#" data-nav="char:'+esc(n)+'">'+esc(ch.display||ch.name)+'</a>'
        + '<select data-charpick="'+esc(n)+'">'
        + '<option value="">— pick ref ('+refs.length+' available) —</option>';
      refs.forEach(function(r){
        h += '<option value="'+esc(r.name)+'"'+(chosen===r.name?' selected':'')+'>'+esc(r.name)+(r.disk?'':' (local)')+'</option>';
      });
      h += '</select>';
      if (chosen){
        var hit = null;
        refs.forEach(function(r){ if (r.name===chosen) hit = r; });
        if (hit) h += '<img class="pick" src="'+hit.url+'" loading="lazy" alt="">';
      }
      h += '</div>';
    });
    if (!pn) h += '<div style="color:var(--dim);font-size:12.5px">no characters stamped on this chunk</div>';
    var vids = inp.videos || (c.shot_nums||[]);
    (c.shot_nums||[]).forEach(function(sn){
      var vi = vids.indexOf(sn);
      h += '<div class="slot"><span class="lbl">Video '+(vi>=0 ? (vi+1) : '–')+'</span>'
        + '<label style="font-size:12.5px;cursor:pointer"><input type="checkbox" data-videopick="'+esc(sn)+'"'+(vi>=0?' checked':'')+'> shot #'+esc(sn)+' clip</label>'
        + '<video controls preload="metadata" src="clips/full/shot_'+esc(sn)+'.mp4"></video></div>';
    });
    var bgSlug = inp.bg || null;
    var bg = bgSlug ? bgBySlug(bgSlug) : null;
    if (!bg){ var s0 = shotByNum((c.shot_nums||[])[0]); bg = s0 ? bgForSetting(s0.detail.setting) : null; }
    h += '<div class="slot"><span class="lbl">plate</span>'
      + '<select data-bgpick><option value="">— none —</option>';
    R.backgrounds.forEach(function(b){
      h += '<option value="'+esc(b.slug)+'"'+((bg&&bg.slug===b.slug)?' selected':'')+'>'+esc(b.name)+' ('+esc(b.slug)+')</option>';
    });
    h += '</select>';
    if (bg) h += ' <a href="#" data-nav="bg:'+esc(bg.slug)+'" style="font-size:12.5px">'+refsFor('bg', bg.slug).length+' plate refs</a>';
    h += '</div></div>';
    return h;
  }
  function wirePromptInputs(c){
    var inp = promptInputs[c.id] = promptInputs[c.id] || {};
    inp.char = inp.char || {};
    Array.prototype.forEach.call($detail.querySelectorAll('[data-charpick]'), function(sel){
      sel.onchange = function(){
        var n = this.getAttribute('data-charpick');
        if (this.value) inp.char[n] = this.value; else delete inp.char[n];
        saveInputs(); render();
      };
    });
    Array.prototype.forEach.call($detail.querySelectorAll('[data-videopick]'), function(cb){
      cb.onchange = function(){
        var sn = this.getAttribute('data-videopick');
        var vids = inp.videos = inp.videos || (c.shot_nums||[]).slice();
        var i = vids.indexOf(sn);
        if (this.checked && i < 0){ vids.push(sn); vids.sort(); }
        if (!this.checked && i >= 0) vids.splice(i, 1);
        saveInputs(); render();
      };
    });
    var bgSel = $detail.querySelector('[data-bgpick]');
    if (bgSel) bgSel.onchange = function(){ inp.bg = this.value || null; saveInputs(); };
  }

    h += '<div class="crumb">character</div>';

    h += '<div class="section"><h3>Reference stills ('+refs.length+')</h3><div class="refgrid">';

    h += '<div class="section"><h3>Appears in '+appChunks.length+' chunks</h3>';
    appChunks.slice(0, 40).forEach(function(k){
      h += '<div><a href="#" data-nav="chunk:'+esc(k.id)+'">'+esc(k.id)+'</a> <span style="color:var(--dim);font-size:12px">'+esc(k.scene||'')+' · shots '+esc((k.shot_nums||[]).join(', '))+'</span></div>';
    });
    if (appChunks.length > 40) h += '<div style="color:var(--dim)">…and '+(appChunks.length-40)+' more</div>';
    if (!appChunks.length) h += '<div style="color:var(--dim)">no chunks reference this character</div>';
    h += '</div>';
    h += '<div class="section"><h3>Stills from scenes they appear in</h3>';
    h += '<div style="color:var(--dim);font-size:12px;margin-bottom:8px">Click a still to copy it into this character\'s refs. If the refs folder isn\'t connected, you\'ll be asked again.</div>';
    h += '<div class="scenestills" id="sceneStills">';
    var seenShot = {};
    var stillCount = 0;
    appChunks.forEach(function(k){

        sh.stills.forEach(function(fn){
          stillCount++;
          var already = refs.some(function(r){ return r.name === fn; });
          bits += '<div class="pick'+(already?' added':'')+'" data-addstill="'+esc(fn)+'" title="add '+esc(fn)+' to refs">'
            + '<img src="stills/full/'+encodeURIComponent(fn)+'" loading="lazy" alt="'+esc(fn)+'">'
            + '<span class="badge">added</span>'
            + '<div class="nm">'+esc(fn)+'</div></div>';

      if (bits){
        h += '<div class="scenestill-grp"><div class="gh"><a href="#" data-nav="chunk:'+esc(k.id)+'">'+esc(k.id)+'</a> '

      traitEdits[c.name] = text; saveTraits();

      st.textContent = 'saving…';
      saveTraitsToFile(c.name, text, function(msg){
        var el = document.getElementById('traitStatus');
        if (el) el.textContent = msg;
        renderList(state());
      });

    document.getElementById('addRef').onclick = function(){ pickFiles('char', c.name); };
    Array.prototype.forEach.call($detail.querySelectorAll('[data-addstill]'), function(el){
      el.onclick = function(){
        var fn = this.getAttribute('data-addstill');
        addStillAsRef('char', c.name, fn, this);
      };

    Array.prototype.forEach.call($detail.querySelectorAll('[data-delref]'), function(el){
      el.onclick = function(){
        var nm = this.getAttribute('data-delref');
        localRefs = localRefs.filter(function(r){ return !(r.kind==='char' && r.key===c.name && r.name===nm); });
        saveRefs(); render();
      };

    wireUpload();
  }

  /* Setups workspace: scene overview (setup strip + manual re-tag) and
     single-setup detail (shots, plate binding, prompt-together context). */
  function detailScene(sc){
    var tags = allSetupTags(sc);
    var h = '';
    h += '<div class="crumb">setups</div>';
    h += '<h2><span class="mono">'+esc(sc.scene)+'</span>'+(sc.crosscut?' <span style="color:var(--accent2);font-size:13px">CROSS-CUT ('+sc.alternations+' alternations)</span>':'')+'</h2>';
    h += '<div class="metaline">'+sc.shots+' shots · '+tags.length+' setups · SSIM clustering from core/continuity.py, manual moves override</div>';
    h += '<div class="banner"><span>Prompt all shots of one setup together (shared background plate), then split them apart again at assembly. Click a setup to open it; drag is not supported — use the shot page or setup detail to move shots between setups.</span></div>';
    // sequence strip
    h += '<div class="section"><h3>Cut sequence</h3><div class="seqstrip">';
    sc.seq.forEach(function(t, idx){
      var sel = st_setupSelected && t===st_setupSelected;
      h += '<span class="seqtag'+(sel?' sel':'')+'" data-nav="setup:'+esc(t)+'" title="'+esc(t)+'">'+esc(t.split('-')[1]||t)+'</span>';
    });
    h += '</div></div>';
    // setup cards
    h += '<div class="section"><h3>Setups</h3>';
    tags.forEach(function(t){
      var mem = setupMembers(sc, t);
      var plate = setupPlates[t];
      var moved = mem.filter(function(n){ return setupMoves[n]; }).length;
      h += '<div class="setupcard">';
      h += '<div class="shead"><a href="#" data-nav="setup:'+esc(t)+'">'+esc(t)+'</a> · '+mem.length+' shot'+(mem.length===1?'':'s')

        + (plate?' · plate: <a href="#" data-nav="bg:'+esc(plate)+'">'+esc(plate)+'</a>':' · <span style="color:var(--dim2);font-size:11.5px">no plate</span>')+'</div>';

      h += '</div></div>';
    });
    h += '</div>';

    h += '<div class="slot"><span class="lbl">plate</span><select id="plateSel">'
      + '<option value="">— none —</option>';
    R.backgrounds.forEach(function(b){
      h += '<option value="'+esc(b.slug)+'"'+(plate===b.slug?' selected':'')+'>'+esc(b.name||b.slug)+'</option>';
    });
    h += '</select>'
      + (plate?' <a href="#" data-nav="bg:'+esc(plate)+'">open background</a>':' <span style="color:var(--dim);font-size:12px">bind one plate; every shot of this setup is prompted with it</span>')+'</div>';
    h += '</div>';
    // notes
    h += '<div class="section"><h3>Setup notes</h3>'
      + '<textarea class="trait" id="setupNote" placeholder="staging, lighting, what the shared plate must hold…">'+esc(setupNotes[tag]||'')+'</textarea></div>';
    // shots with move controls
    h += '<div class="section"><h3>Shots ('+mem.length+')</h3>';
    var otherTags = allSetupTags(sc).filter(function(t){ return t !== tag; });
    mem.forEach(function(n){
      var sh = shotByNum(n);
      h += '<div class="slot"><span class="lbl">#'+esc(n)+'</span>'
        + '<video controls preload="metadata" src="clips/full/shot_'+encodeURIComponent(n)+'.mp4"></video>';
      if (sh) h += '<span style="color:var(--dim);font-size:12px">'+sh.dur+'s · '+esc(sh.chunk||'')+' · '+esc(sh.detail.setting||'')+'</span>';
      if (setupMoves[n]) h += '<span style="color:var(--accent);font-size:11px">moved from '+esc(SU.shot_setup[n]||'?')+'</span>';
      h += '<a href="#" data-nav="shot:'+esc(n)+'">open</a>';
      h += '<select data-moveshot="'+esc(n)+'"><option value="">move to…</option>';
      otherTags.forEach(function(t){ h += '<option value="'+esc(t)+'">'+esc(t)+'</option>'; });
      h += '<option value="__new">+ new setup…</option></select>';
      h += '</div>';
    });
    if (!mem.length) h += '<div style="color:var(--dim)">this setup has no shots (all moved away) — <a href="#" data-nav="scene:'+esc(sc.scene)+'">back to scene</a></div>';
    h += '</div>';
    // edges touching these shots
    var edges = sc.edges.filter(function(e){
      var a = e.from.replace('shot:',''), b2 = e.to.replace('shot:','');
      return mem.indexOf(a) >= 0 || mem.indexOf(b2) >= 0;
    });
    if (edges.length){
      h += '<div class="section"><h3>SSIM edges</h3>';
      edges.forEach(function(e){
        h += '<div class="dl"><span class="sp">'+esc(e.from.replace('shot:','#'))+'→'+esc(e.to.replace('shot:','#'))+'</span>'
          + '<span class="tx">'+e.ssim.toFixed(3)+' · '+esc(e.edge)+'</span></div>';
      });
      h += '</div>';
    }
    $detail.innerHTML = h;
    document.getElementById('plateSel').onchange = function(){
      if (this.value) setupPlates[tag] = this.value; else delete setupPlates[tag];
      saveSetupPlates(); render();
    };
    document.getElementById('setupNote').onchange = function(){
      if (this.value) setupNotes[tag] = this.value; else delete setupNotes[tag];
      saveSetupNotes();
    };
    Array.prototype.forEach.call($detail.querySelectorAll('[data-moveshot]'), function(sel){
      sel.onchange = function(){
        var n = this.getAttribute('data-moveshot');
        var v = this.value;
        if (!v) return;
        if (v === '__new'){
          var base = tag.split('-')[0];
          var used = {};
          allSetupTags(sc).forEach(function(t){ var m = t.match(/-([A-Za-z]+)$/); if (m) used[m[1]] = 1; });
          var code = 'A';
          while (used[code]) code = String.fromCharCode(code.charCodeAt(0)+1);
          v = base + '-' + code;
        }
        if ((SU.shot_setup[n]||null) === v) delete setupMoves[n];
        else setupMoves[n] = v;
        saveSetupMoves(); render();
      };
    });
  }

  /* ----------------------------------------------------------- uploads
     Preferred path: File System Access API (Chrome/Edge) — connect
     E:\FNI\refs once per session and uploads write real files to
     refs/characters/<NAME>/ and refs/backgrounds/<slug>/. Afterwards
     run tools/scan_refs.py to bake the file list into refs-data.js.
     Fallback: data URLs in localStorage + "export bundle" JSON that
     tools/import_refs.py unpacks to the same places. */
  var dirHandle = null;
  function wireUpload(){
    var b = document.getElementById('upBanner');
    if (!b) return;
    if (window.showDirectoryPicker){
      b.innerHTML = (dirHandle
          ? '<span>writing into the connected refs folder ✓</span>'
          : '<span>Uploads can write real files under <code>E:\\FNI\\refs\\</code> — connect the folder once (Chrome/Edge). Without it, refs stay browser-local.</span><button class="btn" id="connDir">connect refs folder…</button>')
        + '<button class="btn" id="expBundle">export bundle</button>';
      var cd = document.getElementById('connDir');
      if (cd) cd.onclick = function(){
        window.showDirectoryPicker({mode:'readwrite'}).then(function(dh){
          dirHandle = dh; wireUpload();
        }).catch(function(){});
      };
    } else {
      b.innerHTML = '<span>This browser can\'t write to disk. Uploads are kept browser-local — export the bundle, then run <code>python tools/import_refs.py fni-refs-bundle.json</code>.</span>'
        + '<button class="btn" id="expBundle">export bundle</button>';
    }
    document.getElementById('expBundle').onclick = exportBundle;
  }
  function dataUrlToBlob(dataUrl){
    var i = dataUrl.indexOf(',');
    var head = dataUrl.slice(0, i), body = dataUrl.slice(i+1);
    if (head.indexOf(';base64') >= 0){
      var bin = atob(body);
      var u8 = new Uint8Array(bin.length);
      for (var j=0;j<bin.length;j++) u8[j] = bin.charCodeAt(j);
      return new Blob([u8]);
    }
    return new Blob([decodeURIComponent(body)]);
  }
  function pickFiles(kind, key){
    // folder connection is a PREREQ for picking files — refs must land on disk
    if (!window.showDirectoryPicker){
      alert('This browser cannot write files (needs Chrome/Edge). Copy images into refs/' + (kind==='char'?'characters':'backgrounds') + '/ manually, then run tools/scan_refs.py');
      return;
    }
    if (!dirHandle){
      window.showDirectoryPicker({mode:'readwrite'}).then(function(dh){
        dirHandle = dh; wireUpload(); pickFiles(kind, key);
      }).catch(function(){
        alert('Connect the refs folder (E:\\FNI\\refs) before uploading.');
      });
      return;
    }
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = true;
    inp.onchange = function(){
      var files = Array.prototype.slice.call(inp.files || []);
      if (!files.length) return;
      var pending = files.length;
      files.forEach(function(f){
        var fr = new FileReader();
        fr.onload = function(){
          var dataUrl = fr.result;
          // browser-local copy so the ref shows up before the next scan_refs.py
          localRefs = localRefs.filter(function(r){ return !(r.kind===kind && r.key===key && r.name===f.name); });
          localRefs.push({kind:kind, key:key, name:f.name, dataUrl:dataUrl});
          saveRefs();
          function fin(){ pending--; if (pending === 0) render(); }
          var sub = kind==='char' ? 'characters' : 'backgrounds';
          dirHandle.getDirectoryHandle(sub, {create:true})
            .then(function(d1){ return d1.getDirectoryHandle(key, {create:true}); })
            .then(function(d2){ return d2.getFileHandle(f.name, {create:true}); })
            .then(function(fh){ return fh.createWritable(); })
            .then(function(w){ return w.write(dataUrlToBlob(dataUrl)).then(function(){ return w.close(); }); })
            .then(fin, function(e){ console.error('disk write failed', e); fin(); });
        };
        fr.readAsDataURL(f);
      });
    };
    inp.click();
  }
  /* Copy a scene still into the character's refs folder.
     file:// pages cannot fetch(), so read the pixels off the <img>
     that already loaded. Folder connection is still a prereq. */
  function addStillAsRef(kind, key, fn, el){
    function already(){
      return refsFor(kind, key).some(function(r){ return r.name === fn; });
    }
    if (already()) return;
    var img = el ? el.querySelector('img') : null;
    function blobFromImg(done, fail){
      if (!img || !img.complete || !img.naturalWidth){ fail(new Error('still not loaded')); return; }
      try {
        var cnv = document.createElement('canvas');
        cnv.width = img.naturalWidth; cnv.height = img.naturalHeight;
        cnv.getContext('2d').drawImage(img, 0, 0);
        cnv.toBlob(function(blob){
          if (blob) done(blob); else fail(new Error('could not encode still'));
        }, 'image/jpeg', 0.92);
      } catch (e) { fail(e); }
    }
    function viaFetch(done, fail){
      fetch('stills/full/' + encodeURIComponent(fn)).then(function(res){
        if (!res.ok) throw new Error('HTTP '+res.status);
        return res.blob();
      }).then(done).catch(fail);
    }
    function writeBlob(blob){
      var sub = kind==='char' ? 'characters' : 'backgrounds';
      var outName = fn.replace(/\.jpe?g$/i, '.jpg');
      dirHandle.getDirectoryHandle(sub, {create:true})
        .then(function(d1){ return d1.getDirectoryHandle(key, {create:true}); })
        .then(function(d2){ return d2.getFileHandle(outName, {create:true}); })
        .then(function(fh){ return fh.createWritable(); })
        .then(function(w){ return w.write(blob).then(function(){ return w.close(); }); })
        .then(function(){
          var fr = new FileReader();
          fr.onload = function(){
            localRefs = localRefs.filter(function(r){ return !(r.kind===kind && r.key===key && r.name===outName); });
            localRefs.push({kind:kind, key:key, name:outName, dataUrl:fr.result});
            saveRefs();
            render();
          };
          fr.readAsDataURL(blob);
        })
        .catch(function(e){ console.error('still copy failed', e); alert('Could not write '+outName+' into the refs folder: '+e); });
    }
    function readThenWrite(){
      blobFromImg(writeBlob, function(){
        viaFetch(writeBlob, function(e){
          alert('Could not read still '+fn+' ('+e+'). The thumbnail has to finish loading first.');
        });
      });
    }
    if (!window.showDirectoryPicker){
      alert('This browser cannot write files (needs Chrome/Edge). Copy stills/full/'+fn+' into refs/' + (kind==='char'?'characters':'backgrounds') + '/'+key+'/ manually, then run tools/scan_refs.py');
      return;
    }
    if (!dirHandle){
      window.showDirectoryPicker({mode:'readwrite'}).then(function(dh){
        dirHandle = dh; wireUpload(); readThenWrite();
      }).catch(function(){
        alert('Connect the refs folder (E:\\FNI\\refs) before adding stills.');
      });
      return;
    }
    readThenWrite();
  }
  // traits save: writes refs/characters/<NAME>/traits.txt via the connected folder
  function saveTraitsToFile(name, text, done){
    function writeIt(){
      dirHandle.getDirectoryHandle('characters', {create:true})
        .then(function(d1){ return d1.getDirectoryHandle(name, {create:true}); })
        .then(function(d2){ return d2.getFileHandle('traits.txt', {create:true}); })
        .then(function(fh){ return fh.createWritable(); })
        .then(function(w){ return w.write(text).then(function(){ return w.close(); }); })
        .then(function(){ done('saved → refs/characters/' + name + '/traits.txt'); },
              function(e){ done('save failed: ' + e); });
    }
    if (dirHandle){ writeIt(); return; }
    if (!window.showDirectoryPicker){ done('this browser cannot write files (needs Chrome/Edge)'); return; }
    window.showDirectoryPicker({mode:'readwrite'}).then(function(dh){
      dirHandle = dh; wireUpload(); writeIt();
    }).catch(function(){ done('folder not connected — traits kept browser-local only'); });
  }
  function exportBundle(){
    var bundle = {
      version: 1,
      exported: new Date().toISOString(),
      refs: localRefs,
      traits: traitEdits,
      bg_settings: settingEdits,
      prompt_inputs: promptInputs,
      setup_moves: setupMoves,
      setup_plates: setupPlates,
      setup_notes: setupNotes
    };
    var blob = new Blob([JSON.stringify(bundle)], {type:'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'fni-refs-bundle.json';
    document.body.appendChild(a); a.click(); a.remove();
  }

  /* ------------------------------------------------------------ tests */
  function detailRun(r){
    var h = '';
    h += '<div class="crumb">test run · <span class="mono">'+esc(r.id)+'</span>'
      + (r.scope ? ' · scene '+esc(r.scope) : '') + '</div>';
    h += '<h2><span class="mono">'+esc(r.id)+'</span> '+esc(r.title||'')+'</h2>';
    h += '<div class="metaline">'+esc(r.status||'')+' <span>·</span> '+r.files.length+' clips'
      + (r.verdict ? ' <span>·</span> verdict: '+esc(r.verdict) : '') + '</div>';
    if (r.question){
      h += '<div class="section"><h3>Question</h3><div>'+esc(r.question)+'</div></div>';
    }
    if (r.notes){
      h += '<div class="section"><h3>Notes</h3><div>'+esc(r.notes)+'</div></div>';
    }
    if (r.files.length){
      h += '<div class="section"><h3>Clips</h3>';
      r.files.forEach(function(f){
        h += '<div class="slot"><span class="lbl">'+esc(f.split("/").pop())+'</span>'
          + '<video controls preload="metadata" src="'+esc(encodeURI(f))+'"></video>'
          + '<a href="'+esc(encodeURI(f))+'" target="_blank">open</a></div>';
      });
      h += '</div>';
    } else {
      h += '<div class="section"><h3>Clips</h3><div class="empty">no clips on disk yet — '
        + 'renders may still be in flight, or copy them from the 5090 output drive into runs/testruns/ '
        + 'and re-run <code>tools/build_testruns_data.py</code></div></div>';
    }
    $detail.innerHTML = h;
  }

  /* ------------------------------------------------------------ render
     Pure function of the URL. */
  function render(){
    var st = state();
    document.getElementById('tabShots').className  = 'tab' + (st.view==='shots'?' active':'');
    document.getElementById('tabChunks').className = 'tab' + (st.view==='chunks'?' active':'');
    document.getElementById('tabSetups').className = 'tab' + (st.view==='setups'?' active':'');
    document.getElementById('tabChars').className  = 'tab' + (st.view==='chars'?' active':'');
    document.getElementById('tabBgs').className    = 'tab' + (st.view==='bgs'?' active':'');
    document.getElementById('tabTests').className  = 'tab' + (st.view==='tests'?' active':'');
    ['NEKRON','TEEGRA','LARN'].forEach(function(x){
      var el = document.getElementById('f'+(x.charAt(0)+x.slice(1).toLowerCase()));
      el.className = 'chip' + (st.charFilter===x?' active':'');
      el.style.display = (st.view==='shots'||st.view==='chunks') ? '' : 'none';
    });
    var q = document.getElementById('q');
    if (q.value !== st.q && document.activeElement !== q) q.value = st.q;
    q.placeholder = st.view==='chars' ? 'search characters…' : st.view==='bgs' ? 'search backgrounds…' : st.view==='setups' ? 'search scenes / setups…' : st.view==='tests' ? 'search test runs…' : 'search shot / chunk / text…';

    renderList(st);

    if (st.view === 'shots'){
      var s = st.selShot ? shotByNum(st.selShot) : null;
      detailShot(s || shots[0]);
    } else if (st.view === 'chunks'){
      var c = st.selChunk ? chunkById(st.selChunk) : null;
      detailChunk(c || chunks[0]);
    } else if (st.view === 'setups'){
      if (st.selSetup){
        var sc2 = setupSceneOf(st.selSetup);
        if (sc2) detailSetup(sc2, st.selSetup);
        else $detail.innerHTML = '<div class="empty">unknown setup '+esc(st.selSetup)+'</div>';
      } else if (st.selScene){
        var sc1 = sceneById(st.selScene);
        if (sc1) { st_setupSelected = null; detailScene(sc1); }
        else $detail.innerHTML = '<div class="empty">unknown scene '+esc(st.selScene)+'</div>';
      } else if (SU.scenes.length){
        st_setupSelected = null; detailScene(SU.scenes[0]);
      } else {
        $detail.innerHTML = '<div class="empty">no continuity data — run core/continuity.py then tools/build_setups_data.py</div>';
      }
    } else if (st.view === 'chars'){
      var ch = st.selChar ? charByName(st.selChar) : null;
      if (ch) detailChar(ch);
      else $detail.innerHTML = '<div class="empty">select a character — upload reference stills, edit traits, then bind them to <code>&lt;Picture N&gt;</code> slots on chunk pages</div>';
    } else if (st.view === 'bgs'){
      var bg = st.selBg ? bgBySlug(st.selBg) : null;
      if (bg) detailBg(bg);
      else $detail.innerHTML = '<div class="empty">select a background — upload plates and edit the setting strings it should match</div>';
    } else if (st.view === 'tests'){
      var run = null;
      for (var i=0;i<T.runs.length;i++) if (T.runs[i].id===st.selRun) run = T.runs[i];
      if (!run) run = T.runs[0];
      if (run) detailRun(run);
      else $detail.innerHTML = '<div class="empty">no test runs recorded — run <code>tools/build_testruns_data.py</code></div>';
    }
    var sel = $list.querySelector('.selected');
    if (sel) sel.scrollIntoView({block:'nearest'});
  }

  /* ------------------------------------------------------------ wiring */
  window.addEventListener('popstate', render);

  document.getElementById('tabShots').onclick  = function(){ var st = state(); nav({view:'shots',  chunk:null, char:null, bg:null, scene:null, setup:null, shot: st.selShot || shots[0].num}); };
  document.getElementById('tabChunks').onclick = function(){ var st = state(); nav({view:'chunks', shot:null,  char:null, bg:null, scene:null, setup:null, chunk: st.selChunk || chunks[0].id}); };
  document.getElementById('tabSetups').onclick = function(){ nav({view:'setups', shot:null, chunk:null, char:null, bg:null, run:null, setup:null, scene: (state().selScene || (SU.scenes[0] && SU.scenes[0].scene) || null)}); };
  document.getElementById('tabChars').onclick  = function(){ nav({view:'chars',  shot:null, chunk:null, bg:null, scene:null, setup:null}); };
  document.getElementById('tabBgs').onclick    = function(){ nav({view:'bgs',    shot:null, chunk:null, char:null, scene:null, setup:null}); };
  document.getElementById('tabTests').onclick  = function(){ nav({view:'tests',  shot:null, chunk:null, char:null, bg:null, scene:null, setup:null, run: (state().selRun || (T.runs[0] && T.runs[0].id) || null)}); };

  function toggleChip(k){ var st = state(); nav({f: st.charFilter===k ? null : k}); }
  document.getElementById('fNekron').onclick = function(){ toggleChip('NEKRON'); };
  document.getElementById('fTeegra').onclick = function(){ toggleChip('TEEGRA'); };
  document.getElementById('fLarn').onclick   = function(){ toggleChip('LARN'); };

  var qTimer = null;
  document.getElementById('q').oninput = function(){
    var v = this.value.trim();
    clearTimeout(qTimer);
    qTimer = setTimeout(function(){ nav({q: v || null}, true); }, 250);
  };

  // every in-page link/button with data-nav="kind:value" navigates via URL
  document.addEventListener('click', function(e){
    var a = e.target.closest ? e.target.closest('[data-nav]') : null;
    if (!a || a.disabled) return;
    e.preventDefault();
    var spec = a.getAttribute('data-nav');
    var i = spec.indexOf(':');
    if (i < 0) return;
    var k = spec.slice(0, i), v = spec.slice(i+1);
    var patch = {shot:null, chunk:null, char:null, bg:null, scene:null, setup:null};
    if (k === 'shot'){ patch.view = 'shots'; patch.shot = v; }
    else if (k === 'chunk'){ patch.view = 'chunks'; patch.chunk = v; }
    else if (k === 'char'){ patch.view = 'chars'; patch.char = v; }
    else if (k === 'bg'){ patch.view = 'bgs'; patch.bg = v; }
    else if (k === 'setup'){ patch.view = 'setups'; patch.setup = v; patch.scene = v.split('-')[0]; }
    else if (k === 'scene'){ patch.view = 'setups'; patch.scene = v; }
    else if (k === 'view'){ patch.view = v; }
    else return;
    nav(patch);
  });

  /* init: normalize whatever the URL holds (aliases ?shotid=/?s=,
     missing view) into canonical params with replaceState, then let
     render() draw purely from the URL. */
  (function init(){
    var p = params();
    var view = p.get('view');
    if (!view){
      if (p.get('chunk')||p.get('chunkid')||p.get('c')) view = 'chunks';
      else if (p.get('setup')||p.get('scene')) view = 'setups';
      else if (p.get('char')||p.get('charid')) view = 'chars';
      else if (p.get('bg')||p.get('bgid')) view = 'bgs';
      else view = 'shots';
    }
    if (['shots','chunks','setups','chars','bgs'].indexOf(view) < 0) view = 'shots';
    var sn = null, cid = null, cn = null, bs = null, scn = null, su = null;
    if (view === 'shots'){
      sn = pad5(p.get('shot') || p.get('shotid') || p.get('s'));
      if (!sn || !shotByNum(sn)) sn = shots[0].num;
    } else if (view === 'chunks'){
      cid = p.get('chunk') || p.get('chunkid') || p.get('c');
      if (!cid || !chunkById(cid)) cid = chunks[0].id;
    } else if (view === 'setups'){
      su = p.get('setup');
      scn = p.get('scene');
      if (su){ var sc = setupSceneOf(su); if (sc){ scn = sc.scene; } else { su = null; } }
      if (scn && !sceneById(scn)) scn = null;
      if (!scn && SU.scenes.length) scn = SU.scenes[0].scene;
    } else if (view === 'chars'){
      cn = (p.get('char') || p.get('charid') || '').toUpperCase();
      if (cn && !charByName(cn)) cn = null;
    } else {
      bs = p.get('bg') || p.get('bgid');
      if (bs && !bgBySlug(bs)) bs = null;
    }
    var p2 = new URLSearchParams();
    if (view !== 'shots') p2.set('view', view);
    if (sn) p2.set('shot', sn);
    if (cid) p2.set('chunk', cid);
    if (cn) p2.set('char', cn);
    if (bs) p2.set('bg', bs);
    if (scn) p2.set('scene', scn);
    if (su) p2.set('setup', su);
    if (p.get('f')) p2.set('f', String(p.get('f')).toUpperCase());
    if (p.get('q')) p2.set('q', p.get('q'));
    history.replaceState(null, '', location.pathname + (p2.toString() ? '?' + p2.toString() : ''));
    render();
  })();
})();
